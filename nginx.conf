# ==============================================================================
# Medax Production Nginx Konfiguratsiyasi (Xavfsizlik & Proksi)
# ==============================================================================

server {
    listen 80;
    server_name medax.uz www.medax.uz;

    # HTTP dan HTTPS ga yo'naltirish
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name medax.uz www.medax.uz;

    # SSL sertifikatlari (Let's Encrypt / Cloudflare Origin)
    ssl_certificate /etc/letsencrypt/live/medax.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/medax.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 1. Qat'iy Xavfsizlik Sarlavhalari (Security Headers)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 2. Fayl yuklash limiti (Excel va mahsulot rasmlari uchun)
    client_max_body_size 30M;

    # 3. Gzip siqish (Tezkor yuklanish uchun)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # 4. Frontend Statik Fayllari (Vite Build /dist)
    root /var/www/medtex/frontend/dist;
    index index.html;

    # 5. API So'rovlarini Node.js (Express) backendga yo'naltirish
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;

        # Mijozning haqiqiy IP manzilini xavfsiz uzatish (Cloudflare va Nginx mosligi)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Agar Cloudflare ishlatilsa, CF-Connecting-IP avtomatik o'tadi
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 6. Yuklangan mahsulot rasmlari va fayllar (/uploads)
    location /uploads/ {
        alias /var/www/medtex/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # 7. Single Page Application (React Router SPA fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
