databases:
  - name: medax-db
    databaseName: medax_db
    user: medax_user
    plan: free

services:
  - type: web
    name: medax-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss && npm run build && npm run seed
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: medax-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CUSTOMER_JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "https://medax.uz,https://www.medax.uz,https://medtex-xi.vercel.app"
      - key: ADMIN_EMAIL
        value: "admin@medtex.uz"
      - key: ADMIN_PASSWORD
        value: "Medax2026Admin!"
      - key: SMS_PROVIDER
        value: "console"
